<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" th:content="${'2;url=/upload?job=' + jobId}">
    <title>장부 처리 중</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-admin-system.css(v=20260813_1)}">
    <link rel="stylesheet" th:href="@{/css/premium-mobile-v2.css(v=20260813_1)}">
    <style>
        .upload-processing-wrap {
            max-width: 760px;
            margin: 8vh auto 0;
        }
        .upload-processing-card {
            text-align: center;
            padding: 42px 28px;
        }
        .upload-processing-spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 20px;
            border: 4px solid #e7edf3;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: upload-spin .9s linear infinite;
        }
        .upload-processing-card h1 {
            margin-bottom: 10px;
        }
        .upload-processing-card p {
            margin: 8px 0;
        }
        .upload-processing-file {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #f5f7fa;
            font-weight: 700;
            word-break: break-all;
        }
        @keyframes upload-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<main class="container upload-processing-wrap">
    <section class="panel upload-processing-card">
        <div class="upload-processing-spinner" aria-hidden="true"></div>
        <p class="eyebrow">장부 업로드</p>
        <h1>엑셀을 처리하고 있습니다</h1>
        <p>파일 전송은 끝났습니다. 엑셀 검사와 DB 동기화는 서버에서 따로 진행하고 있습니다.</p>
        <p>이 화면은 자동으로 결과를 확인하므로 다시 업로드 버튼을 누르지 마세요.</p>
        <span class="upload-processing-file" th:text="${jobFilename}">input_data.xlsx</span>
        <div class="button-row" style="justify-content:center; margin-top:22px;">
            <a class="secondary-link" th:href="@{/upload(job=${jobId})}">지금 상태 확인</a>
        </div>
    </section>
</main>
</body>
</html>
