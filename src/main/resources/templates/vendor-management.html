<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래처 관리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/global-sidebar-and-recovery.css(v=20260814_2)}">
    <link rel="stylesheet" th:href="@{/css/sidebar-size-fixed.css(v=20260814_1)}">
    <link rel="stylesheet" th:href="@{/css/pc-logout-fixed.css(v=20260814_1)}">
    <link rel="stylesheet" th:href="@{/css/vendor-management-v2.css(v=20260818_1)}">
</head>
<body>
<main class="vendor-v2-shell">
    <section class="vendor-v2-hero">
        <div>
            <p>거래처 업무</p>
            <h1>거래처 관리</h1>
            <p>거래처를 선택하면 기본단가, 월별 사용금액, 일별 주문과 행사 단가를 한 화면에서 관리할 수 있습니다.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="secondary-link" th:href="@{/vendor-management/new}" style="background:#3182f6;color:#fff;border-color:#3182f6">+ 거래처 추가</a>
            <a class="secondary-link" th:href="@{/vendors}">배송코스 관리</a>
        </div>
    </section>

    <section class="v2-panel">
        <input id="vendorSearch" class="vendor-search" type="search" placeholder="거래처명 검색">
        <div class="initial-filter" id="initialFilter">
            <button type="button" class="active" data-initial="">전체</button>
            <button type="button" data-initial="ㄱ">ㄱ</button><button type="button" data-initial="ㄴ">ㄴ</button><button type="button" data-initial="ㄷ">ㄷ</button><button type="button" data-initial="ㄹ">ㄹ</button><button type="button" data-initial="ㅁ">ㅁ</button><button type="button" data-initial="ㅂ">ㅂ</button><button type="button" data-initial="ㅅ">ㅅ</button><button type="button" data-initial="ㅇ">ㅇ</button><button type="button" data-initial="ㅈ">ㅈ</button><button type="button" data-initial="ㅊ">ㅊ</button><button type="button" data-initial="ㅋ">ㅋ</button><button type="button" data-initial="ㅌ">ㅌ</button><button type="button" data-initial="ㅍ">ㅍ</button><button type="button" data-initial="ㅎ">ㅎ</button>
        </div>

        <div class="vendor-list" id="vendorList">
            <a th:each="vendor : ${vendors}"
               th:href="@{/vendor-management/{id}(id=${vendor.id})}"
               th:data-name="${vendor.inputName}">
                <span class="vendor-card-name">
                    <strong th:text="${vendor.inputName}">거래처</strong>
                    <small th:if="${vendor.statementName != vendor.inputName}" th:text="|명세서: ${vendor.statementName}|">명세서명</small>
                </span>
                <span>›</span>
            </a>
        </div>
    </section>
</main>
<form id="songcheonPcLogoutForm" th:action="@{/logout}" method="post" style="display:none" aria-hidden="true"></form>
<script defer th:src="@{/js/global-sidebar-and-recovery.js(v=20260818_1)}"></script>
<script defer th:src="@{/js/pc-logout-fixed.js(v=20260814_1)}"></script>
<script>
(function(){
  var search=document.getElementById('vendorSearch');
  var list=[].slice.call(document.querySelectorAll('#vendorList a'));
  var activeInitial='';
  var choseong=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function firstInitial(name){var c=(name||'').trim().charCodeAt(0);if(c<0xAC00||c>0xD7A3)return '';return choseong[Math.floor((c-0xAC00)/588)];}
  function apply(){var q=(search.value||'').trim().toLowerCase();list.forEach(function(a){var n=(a.dataset.name||'');var ok=(!q||n.toLowerCase().indexOf(q)>=0)&&(!activeInitial||firstInitial(n)===activeInitial);a.style.display=ok?'flex':'none';});}
  search.addEventListener('input',apply);
  document.getElementById('initialFilter').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;document.querySelectorAll('#initialFilter button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');activeInitial=b.dataset.initial||'';apply();});
})();
</script>
</body>
</html>
