<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래처 관리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/global-sidebar-and-recovery.css(v=20260814_2)}">
    <link rel="stylesheet" th:href="@{/css/sidebar-size-fixed.css(v=20260814_1)}">
    <link rel="stylesheet" th:href="@{/css/pc-logout-fixed.css(v=20260814_1)}">
    <link rel="stylesheet" th:href="@{/css/vendor-management-v2.css(v=20260902_2)}">
</head>
<body>
<main class="vendor-v2-shell">
    <section class="vendor-v2-hero">
        <div>
            <p>거래처 업무</p>
            <h1>거래처 관리</h1>
            <p>거래처를 선택하면 기본단가, 월별 사용금액, 일별 주문과 행사 단가를 한 화면에서 관리할 수 있습니다.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="secondary-link" th:href="@{/vendor-management/new}" style="background:#3182f6;color:#fff;border-color:#3182f6">+ 거래처 추가</a>
            <a class="secondary-link" th:href="@{/vendors}">배송코스 관리</a>
        </div>
    </section>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="v2-panel">
        <input id="vendorSearch" class="vendor-search" type="search" placeholder="거래처명 검색">
        <div class="initial-filter" id="initialFilter">
            <button type="button" class="active" data-initial="">전체</button>
            <button type="button" data-initial="ㄱ">ㄱ</button><button type="button" data-initial="ㄴ">ㄴ</button><button type="button" data-initial="ㄷ">ㄷ</button><button type="button" data-initial="ㄹ">ㄹ</button><button type="button" data-initial="ㅁ">ㅁ</button><button type="button" data-initial="ㅂ">ㅂ</button><button type="button" data-initial="ㅅ">ㅅ</button><button type="button" data-initial="ㅇ">ㅇ</button><button type="button" data-initial="ㅈ">ㅈ</button><button type="button" data-initial="ㅊ">ㅊ</button><button type="button" data-initial="ㅋ">ㅋ</button><button type="button" data-initial="ㅌ">ㅌ</button><button type="button" data-initial="ㅍ">ㅍ</button><button type="button" data-initial="ㅎ">ㅎ</button>
        </div>

        <div class="vendor-list" id="vendorList">
            <a th:each="vendor : ${vendors}"
               th:href="@{/vendor-management/{id}(id=${vendor.id})}"
               th:data-name="${vendor.inputName}">
                <span class="vendor-card-name">
                    <strong th:text="${vendor.inputName}">거래처</strong>
                    <small th:if="${vendor.statementName != vendor.inputName}" th:text="|명세서: ${vendor.statementName}|">명세서명</small>
                </span>
                <span>›</span>
            </a>
        </div>
    </section>

    <section class="v2-panel vendor-full-info-panel">
        <div class="vendor-master-heading">
            <div>
                <h2>거래처 정보</h2>
                <p>배송코스 페이지에 있던 전체 거래처 기본정보입니다. 아래 표 안에서 스크롤해서 확인하고 수정할 수 있습니다.</p>
            </div>
            <strong class="vendor-count" th:text="|전체 ${#lists.size(vendorProfiles)}곳|">전체 0곳</strong>
        </div>

        <div class="vendor-full-info-scroll">
            <table class="vendor-full-info-table">
                <thead>
                <tr>
                    <th>사용</th>
                    <th>거래처</th>
                    <th>코스</th>
                    <th>순서</th>
                    <th>주소</th>
                    <th>전화번호</th>
                    <th>정산방식</th>
                    <th>회수통 보증금</th>
                    <th>메모</th>
                    <th>저장</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${vendorProfiles}">
                    <td>
                        <form th:id="${'vendor-profile-form-' + row.vendorId}"
                              th:action="@{/vendor-management/profile/update}"
                              method="post">
                            <input type="hidden" name="vendorId" th:value="${row.vendorId}">
                            <input type="hidden" name="routeOrder" th:value="${row.routeOrder}">
                            <input type="hidden" name="latitude" th:value="${row.latitude}">
                            <input type="hidden" name="longitude" th:value="${row.longitude}">
                        </form>
                        <input type="checkbox"
                               name="active"
                               value="true"
                               th:checked="${row.active}"
                               th:attr="form=${'vendor-profile-form-' + row.vendorId}">
                    </td>
                    <td>
                        <a class="vendor-name-link" th:href="@{/vendor-management/{id}(id=${row.vendorId})}">
                            <strong th:text="${row.vendorName}">거래처</strong>
                        </a>
                        <small th:if="${row.vendorName != row.statementName}" th:text="|명세서: ${row.statementName}|">명세서명</small>
                    </td>
                    <td>
                        <select name="routeCode" th:attr="form=${'vendor-profile-form-' + row.vendorId}">
                            <option th:each="code : ${routeCodes}"
                                    th:value="${code.name()}"
                                    th:selected="${row.routeCode == code}"
                                    th:text="${code.label}"></option>
                        </select>
                    </td>
                    <td class="center" th:text="${row.routeOrder == null ? '-' : row.routeOrder}">-</td>
                    <td>
                        <input type="text"
                               name="address"
                               th:value="${row.address}"
                               placeholder="거래처 주소"
                               th:attr="form=${'vendor-profile-form-' + row.vendorId}">
                    </td>
                    <td>
                        <input type="text"
                               name="phone"
                               th:value="${row.phone}"
                               placeholder="전화번호"
                               th:attr="form=${'vendor-profile-form-' + row.vendorId}">
                    </td>
                    <td>
                        <select name="paymentCycle" th:attr="form=${'vendor-profile-form-' + row.vendorId}">
                            <option th:each="cycle : ${paymentCycles}"
                                    th:value="${cycle.name()}"
                                    th:selected="${row.paymentCycle == cycle}"
                                    th:text="${cycle.label}"></option>
                        </select>
                    </td>
                    <td class="center">
                        <span th:if="${row.hasReturnContainerDeposit()}"
                              class="deposit-badge"
                              th:text="${#numbers.formatDecimal(row.returnContainerDepositPrice,0,'COMMA',0,'POINT') + '원'}">3,000원</span>
                        <span th:unless="${row.hasReturnContainerDeposit()}" class="muted-badge">없음</span>
                    </td>
                    <td>
                        <input type="text"
                               name="memo"
                               th:value="${row.memo}"
                               placeholder="배송 메모"
                               th:attr="form=${'vendor-profile-form-' + row.vendorId}">
                    </td>
                    <td>
                        <button type="submit"
                                class="vendor-row-save"
                                th:attr="form=${'vendor-profile-form-' + row.vendorId}">저장</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<form id="songcheonPcLogoutForm" th:action="@{/logout}" method="post" style="display:none" aria-hidden="true"></form>
<script defer th:src="@{/js/global-sidebar-and-recovery.js(v=20260818_1)}"></script>
<script defer th:src="@{/js/pc-logout-fixed.js(v=20260814_1)}"></script>
<script>
(function(){
  var search=document.getElementById('vendorSearch');
  var list=[].slice.call(document.querySelectorAll('#vendorList a'));
  var activeInitial='';
  var choseong=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function firstInitial(name){var c=(name||'').trim().charCodeAt(0);if(c<0xAC00||c>0xD7A3)return '';return choseong[Math.floor((c-0xAC00)/588)];}
  function apply(){var q=(search.value||'').trim().toLowerCase();list.forEach(function(a){var n=(a.dataset.name||'');var ok=(!q||n.toLowerCase().indexOf(q)>=0)&&(!activeInitial||firstInitial(n)===activeInitial);a.style.display=ok?'flex':'none';});}
  search.addEventListener('input',apply);
  document.getElementById('initialFilter').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;document.querySelectorAll('#initialFilter button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');activeInitial=b.dataset.initial||'';apply();});
})();
</script>
</body>
</html>
