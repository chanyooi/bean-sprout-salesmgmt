<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>지역 매출 분석</title>
<link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/global-sidebar-and-recovery.css(v=20261125_flat)}"><link rel="stylesheet" th:href="@{/css/songcheon-ui.css(v=20261126_headings)}"><link rel="stylesheet" th:href="@{/css/region-sales.css(v=20261127_3)}"></head>
<body><main class="container region-page"><section class="hero"><div class="hero-row"><h1>지역 매출 분석</h1><a th:href="@{/vendor-management}">거래처 위치 관리 ›</a></div></section>
<form class="panel region-filters" method="get" th:action="@{/region-sales}"><label for="region-month">조회 월</label><input id="region-month" name="month" type="month" th:value="${selectedMonth}" required><label for="region-compare">비교 기준</label><select id="region-compare" name="compare"><option value="previous" th:selected="${compare == 'previous'}">전월 대비</option><option value="year" th:selected="${compare == 'year'}">전년 동월 대비</option><option value="average" th:selected="${compare == 'average'}">최근 3개월 평균</option></select><button type="submit">조회</button><strong th:text="${periodLabel}"></strong></form>
<div class="report-notice warning" th:unless="${comparable}">비교 기간의 매출 기록이 부족합니다.</div><div class="report-notice warning" th:if="${missing > 0}" th:text="|단가 미등록 ${missing}건 제외|"></div>
<section class="region-kpis" id="region-kpis"></section><section class="panel region-map-panel"><div class="region-head"><h2>지역별 매출 변화</h2><div class="region-mode"><button type="button" data-mode="region" aria-pressed="true">지역별</button><button type="button" data-mode="vendor" aria-pressed="false">거래처별</button></div></div><div class="region-legend"><span class="up">● 증가</span><span class="down">● 감소</span><span>● 보합·비교 불가</span><span id="region-map-count"></span><span id="region-location-status" role="status"></span><button type="button" id="region-retry" class="secondary-button">미확인 지역 다시 검색</button></div><div id="region-map" aria-label="거래처 위치 기반 매출 지도"></div><p id="region-map-error" hidden>지도를 불러올 수 없습니다. 아래 표에서 확인하세요.</p></section>
<section class="panel"><div class="region-head"><h2>지역별 매출</h2><button type="button" id="region-clear" class="secondary-button">전체 보기</button></div><div class="region-table-wrap"><table class="region-table"><thead><tr><th>지역</th><th>매출</th><th>비교 매출</th><th>증감액</th><th>증감률</th><th>거래처</th></tr></thead><tbody id="region-groups"></tbody></table></div></section>
<section class="panel"><div class="region-head"><h2 id="region-title">거래처별 매출</h2><select id="region-sort" aria-label="정렬"><option value="delta">증감액 높은 순</option><option value="down">증감액 낮은 순</option><option value="sales">매출 높은 순</option></select></div><div class="region-table-wrap"><table class="region-table"><thead><tr><th>거래처</th><th>지역</th><th>매출</th><th>비교 매출</th><th>증감액</th><th>증감률</th><th>주문</th><th>주소·지역 설정</th></tr></thead><tbody id="region-vendors"></tbody></table></div></section><dialog id="region-dialog"><form id="region-edit-form"><h2>지역 설정</h2><strong id="region-edit-name"></strong><p id="region-edit-address"></p><label for="region-edit-input">읍·면·동</label><input id="region-edit-input" required maxlength="60" placeholder="예: 옥계동"><p id="region-edit-error" role="status"></p><div class="region-dialog-actions"><button type="button" id="region-edit-close" class="secondary-button">취소</button><button type="submit">저장</button></div></form></dialog></main>
<form id="region-location-token" method="post" th:action="@{/region-sales/location}" hidden></form><form id="songcheonPcLogoutForm" th:action="@{/logout}" method="post" style="display:none"></form><script th:inline="javascript">window.regionSalesRows = /*[[${rows}]]*/ [];</script><script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=iwii3ygty2&submodules=geocoder"></script>
<script defer th:src="@{/js/region-sales.js(v=20261127_3)}"></script><script defer th:src="@{/js/global-sidebar-and-recovery.js(v=20261127_region)}"></script><script defer th:src="@{/js/pc-logout-fixed.js(v=20260814_1)}"></script></body></html>
