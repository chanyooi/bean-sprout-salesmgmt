<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh"
          th:if="${jobState == 'RUNNING'}"
          th:content="${'2;url=/input-template/download/wait?job=' + jobId}">
    <title>장부 생성 중</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-admin-system.css(v=20260813_1)}">
    <style>
        .file-wait-wrap { max-width: 720px; margin: 9vh auto 0; }
        .file-wait-card { padding: 42px 28px; text-align: center; }
        .file-wait-spinner {
            width: 44px; height: 44px; margin: 0 auto 20px;
            border: 4px solid #e5e9ee; border-top-color: #3569d4;
            border-radius: 50%; animation: file-wait-spin .9s linear infinite;
        }
        .file-wait-card h1 { margin-bottom: 10px; }
        .file-wait-card p { margin: 8px 0; }
        @keyframes file-wait-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<main class="container file-wait-wrap">
    <section class="panel file-wait-card" th:if="${jobState == 'RUNNING'}">
        <div class="file-wait-spinner" aria-hidden="true"></div>
        <p class="eyebrow">파일 준비 중</p>
        <h1>input_data.xlsx를 만들고 있습니다</h1>
        <p>파일 생성은 서버에서 따로 처리 중이라 이 화면이 오래 연결된 채로 기다리지 않습니다.</p>
        <p>완료되면 자동으로 다운로드가 시작됩니다.</p>
    </section>

    <section class="panel file-wait-card" th:unless="${jobState == 'RUNNING'}">
        <p class="eyebrow">파일 생성 실패</p>
        <h1>다운로드를 준비하지 못했습니다</h1>
        <p th:text="${jobError != null ? jobError : '작업이 만료되었습니다. 다시 시도해주세요.'}"></p>
        <div class="button-row" style="justify-content:center; margin-top:20px;">
            <a class="secondary-link" th:href="@{/input-template}">다시 시도</a>
        </div>
    </section>
</main>
</body>
</html>
