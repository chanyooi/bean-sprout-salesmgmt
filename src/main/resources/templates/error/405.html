<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요청을 다시 확인해주세요 - 송천</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5f7fa;
            color: #191f28;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .error-card {
            width: min(460px, 100%);
            padding: 36px 30px;
            border: 1px solid #e5e8eb;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(0,0,0,.06);
            text-align: center;
        }
        .mark {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 17px;
            background: #eef5ff;
            color: #3182f6;
            font-size: 20px;
            font-weight: 900;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: -.04em;
        }
        p {
            margin: 12px 0 0;
            color: #6b7684;
            font-size: 14px;
            line-height: 1.65;
        }
        .actions {
            margin-top: 26px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .actions button,
        .actions a {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 14px;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        .back { background: #f2f4f6; color: #4e5968; }
        .home { background: #3182f6; color: #fff; }
    </style>
</head>
<body>
<main class="error-card">
    <div class="mark">!</div>
    <h1>요청을 처리할 수 없어요</h1>
    <p>
        이전 작업 화면을 새로고침하거나 뒤로가기를 반복하면서<br>
        이미 끝난 요청이 다시 전송됐을 수 있습니다.<br>
        데이터가 삭제된 것은 아니니 화면으로 돌아가 다시 확인해주세요.
    </p>
    <div class="actions">
        <button type="button" class="back" onclick="history.back()">이전 화면</button>
        <a class="home" href="/">대시보드</a>
    </div>
</main>
</body>
</html>
