<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래처 추가</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/global-sidebar-and-recovery.css(v=20260814_2)}">
    <link rel="stylesheet" th:href="@{/css/sidebar-size-fixed.css(v=20260814_1)}">
    <link rel="stylesheet" th:href="@{/css/pc-logout-fixed.css(v=20260814_1)}">
    <link rel="stylesheet" th:href="@{/css/vendor-management-v2.css(v=20260818_1)}">
</head>
<body>
<main class="vendor-v2-shell">
    <section class="vendor-v2-hero">
        <div>
            <a th:href="@{/vendor-management}" style="text-decoration:none;color:#3182f6">‹ 거래처 목록</a>
            <h1>거래처 추가</h1>
            <p>거래처명과 기본단가를 등록하면 장부 업로드·거래처 관리·엑셀 명세서가 같은 거래처 정보를 사용합니다.</p>
        </div>
    </section>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/vendor-management/new}" method="post">
        <section class="v2-panel">
            <h2>기본 정보</h2>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
                <label style="display:grid;gap:6px;font-size:13px;font-weight:700">거래처명
                    <input type="text" name="inputName" maxlength="100" required placeholder="장부에 들어오는 거래처명" style="min-height:44px">
                </label>
                <label style="display:grid;gap:6px;font-size:13px;font-weight:700">명세서명
                    <input type="text" name="statementName" maxlength="100" placeholder="비우면 거래처명과 동일" style="min-height:44px">
                </label>
                <label style="display:grid;gap:6px;font-size:13px;font-weight:700">전화번호
                    <input type="text" name="phone" maxlength="100" placeholder="문자 발송용" style="min-height:44px">
                </label>
                <label style="display:grid;gap:6px;font-size:13px;font-weight:700">주소
                    <input type="text" name="address" maxlength="300" placeholder="배송 주소" style="min-height:44px">
                </label>
                <label style="display:grid;gap:6px;font-size:13px;font-weight:700">정산 주기
                    <select name="paymentCycle" style="min-height:44px">
                        <option th:each="cycle : ${paymentCycles}" th:value="${cycle.name()}" th:text="${cycle.label}"></option>
                    </select>
                </label>
                <label style="display:grid;gap:6px;font-size:13px;font-weight:700">명세서 전달 방식
                    <select name="statementDeliveryMethod" style="min-height:44px">
                        <option th:each="method : ${statementDeliveryMethods}" th:value="${method.name()}" th:text="${method.label}"></option>
                    </select>
                </label>
            </div>
        </section>

        <section class="v2-panel" style="margin-top:14px">
            <h2>거래처 기본 단가</h2>
            <p style="margin:-4px 0 14px;color:#8b95a1;font-size:12px">판매하는 품목만 입력하면 됩니다. 비워둔 품목은 나중에 거래처 상세에서 추가할 수 있습니다.</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px">
                <label th:each="item : ${items}" style="display:grid;gap:6px;padding:12px;border:1px solid #e5e8eb;border-radius:12px;background:#fff">
                    <strong th:text="${item}" style="font-size:13px">품목</strong>
                    <input type="hidden" name="itemName" th:value="${item}">
                    <input type="number" name="unitPrice" min="0" step="1" placeholder="단가 입력" style="min-height:42px">
                </label>
            </div>
        </section>

        <section class="v2-panel" style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap">
            <span style="margin-right:auto;color:#8b95a1;font-size:12px">추가 후 별도 엑셀 템플릿 시트를 만들지 않아도 월간 명세서에서 거래처 시트가 자동 생성됩니다.</span>
            <a class="secondary-link" th:href="@{/vendor-management}">취소</a>
            <button type="submit" style="border:0;border-radius:10px;padding:12px 20px;background:#3182f6;color:#fff;font-weight:800;cursor:pointer">거래처 추가</button>
        </section>
    </form>
</main>
<form id="songcheonPcLogoutForm" th:action="@{/logout}" method="post" style="display:none" aria-hidden="true"></form>
<script defer th:src="@{/js/global-sidebar-and-recovery.js(v=20260818_1)}"></script>
<script defer th:src="@{/js/pc-logout-fixed.js(v=20260814_1)}"></script>
</body>
</html>
